spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/ticket_booking_test}
    username: ${DB_USERNAME:ticket_booking}
    password: ${DB_PASSWORD:ticket_booking}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  jwt:
    secret: ${JWT_SECRET:test-secret-change-me-please-32-bytes-minimum-abcdefghijklmnop}
    expiration: ${JWT_EXPIRATION:24h}
  booking:
    hold-ttl: ${HOLD_TTL:5m}
    sweeper-interval-ms: ${HOLD_SWEEPER_INTERVAL_MS:30000}

logging:
  level:
    root: INFO
    com.moviebooking.ticket_booking: DEBUG
